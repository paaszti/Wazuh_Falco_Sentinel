apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-master, namespace: wazuh}
spec:
  template:
    spec:
      volumes:
        - name: custom-rules
          configMap: {name: wazuh-custom-rules}
      containers:
        - name: wazuh-manager
          volumeMounts:
            - name: custom-rules
              mountPath: /wazuh-config-mount/etc/rules/falco-rules.xml
              subPath: falco-rules.xml
              readOnly: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-worker, namespace: wazuh}
spec:
  template:
    spec:
      volumes:
        - name: custom-rules
          configMap: {name: wazuh-custom-rules}
      containers:
        - name: wazuh-manager
          volumeMounts:
            - name: custom-rules
              mountPath: /wazuh-config-mount/etc/rules/falco-rules.xml
              subPath: falco-rules.xml
              readOnly: true
