apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-master, namespace: wazuh}
spec:
  template:
    spec:
      containers:
        - name: wazuh-manager
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits:   {cpu: 1000m, memory: 2Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-manager-worker, namespace: wazuh}
spec:
  template:
    spec:
      containers:
        - name: wazuh-manager
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits:   {cpu: 1000m, memory: 2Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: wazuh-indexer, namespace: wazuh}
spec:
  template:
    spec:
      containers:
        - name: wazuh-indexer
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits:   {cpu: 1000m, memory: 2Gi}
