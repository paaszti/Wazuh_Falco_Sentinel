# helm3 install falco falcosecurity/falco -n falco --create-namespace -f falco-values.yaml
tty: true
collectors:
  kubernetes:
    enabled: true
falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: false
falco:
  json_output: true
  syslog_output:
    enabled: false
  file_output:
    enabled: true
    keep_alive: false
    filename: /var/log/falco/falco.json
  rules_files:
  - /etc/falco/rules.d
  append_output:
  - match:
      source: syscall
    extra_fields:
    - wazuh_integration: falco
mounts:
  volumes:
  - name: falco-logs
    hostPath:
      path: /var/log/falco
      type: DirectoryOrCreate
  volumeMounts:
  - name: falco-logs
    mountPath: /var/log/falco
customRules:
  custom_rules.yaml: |
    - list: monitored_ns
      items: [dvwa]
 
    - macro: in_monitored_ns
      condition: (k8smeta.ns.name in (monitored_ns))
 
    - list: lab_shell_binaries
      items: [bash, sh, zsh, csh, ksh, tcsh, ash, dash, fish]
 
    - list: lab_web_processes
      items: [apache2, httpd, php, php-fpm, php-cgi]
 
    - list: lab_web_allowed_ports
      items: [80, 443, 3306, 5432]
 
    - list: lab_listen_allowed_ports
      items: [80, 443, 8080, 3000, 5432, 3306]
 
    - list: lab_node_ips
      items: ["192.168.0.197", "192.168.0.196"]
 
    - list: lab_node_allowed_ports
      items: [80, 443, 3306, 5432]
 
    - list: lab_host_listen_allowed_ports
      items: [22, 53, 1338, 7472, 7946, 9099, 10248, 10249, 10250, 10256, 10257, 10259, 16443, 19001, 25000]
 
    - list: lab_mount_discovery_files
      items: [/proc/mounts, /proc/self/mounts, /proc/self/mountinfo, /etc/mtab, /proc/partitions]
 
    - list: lab_kernel_info_files
      items: [/proc/version, /proc/sys/kernel/osrelease, /proc/sys/kernel/version, /proc/sys/kernel/ostype]
 
    - list: lab_procps_tools
      items: [ps, w, top, uptime, free, vmstat, pgrep, pkill, pidof, watch, pmap, slabtop, pwdx, tload, skill, snice]
 
    - macro: lab_in_scope
      condition: (container.id != host and in_monitored_ns)
 
    - macro: lab_spawned_process
      condition: (evt.type in (execve, execveat) and evt.rawres = 0)
 
    - macro: lab_open_ok
      condition: (evt.type in (open, openat, openat2) and fd.num >= 0)
 
    - rule: "Execution: Interactive Shell in Container"
      desc: A shell was spawned in a monitored container with an attached terminal.
      condition: >
        lab_spawned_process and lab_in_scope and
        proc.name in (lab_shell_binaries) and
        proc.tty != 0
      output: >-
        Interactive shell spawned in container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname tty=%proc.tty cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_execution, T1059.004, shell]
 
    - rule: "Discovery: Mount Table and Partition Read"
      desc: >
        A process in a monitored container successfully opened the mount table or the
        partition list (/proc/mounts, mountinfo, mtab, /proc/partitions). Typical
        precursor of a host filesystem mount.
      condition: >
        lab_open_ok and lab_in_scope and
        fd.name in (lab_mount_discovery_files)
      output: >-
        Mount table or partition list read
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname file=%fd.name res=%evt.res cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1083, T1082]
 
    - rule: "Discovery: Process Enumeration via /proc"
      desc: A process in a monitored container successfully opened the /proc directory (process listing).
      condition: >
        lab_open_ok and lab_in_scope and
        fd.name in ("/proc", "/proc/")
      output: >-
        Process enumeration via /proc
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname file=%fd.name res=%evt.res cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1057]
 
    - rule: "Discovery: IP Address Lookup via hostname"
      desc: The hostname binary was executed with an IP address flag (-i / -I) in a monitored container.
      condition: >
        lab_spawned_process and lab_in_scope and
        proc.name = "hostname" and
        (proc.args contains "-I" or proc.args contains "-i" or
         proc.args contains "--ip-address" or proc.args contains "--all-ip-addresses")
      output: >-
        IP address lookup via hostname
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1016]
 
    - rule: "Discovery: Kernel Information via uname"
      desc: >-
        The uname binary was executed in a monitored container, with any flags (-a, -sa, -r, -v,
        --kernel-release, or none). Matched on the execve itself and deliberately NOT on the
        arguments, so every flag combination is caught; the flags are visible in cmd=. Covers the
        standalone binary and the busybox applet form (busybox uname ...).
      condition: >
        lab_spawned_process and lab_in_scope and
        (proc.name = "uname" or
         (proc.name = "busybox" and (proc.args = "uname" or proc.args startswith "uname ")))
      output: >-
        Kernel information via uname
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1082, kernel_info]
 
    - rule: "Discovery: Kernel Version File Read"
      desc: >-
        A process in a monitored container successfully opened a file that exposes the kernel
        version (/proc/version, /proc/sys/kernel/osrelease|version|ostype). The same information
        as uname, obtained without running uname (for example cat /proc/version).
      condition: >
        lab_open_ok and lab_in_scope and
        fd.name in (lab_kernel_info_files) and
        not (fd.name = "/proc/sys/kernel/osrelease" and proc.name in (lab_procps_tools))
      output: >-
        Kernel version file read
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname file=%fd.name res=%evt.res cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1082, kernel_info]
 
    - rule: "Discovery: Network Configuration Read (/proc/net, /etc/hosts)"
      desc: >
        A process in a monitored container successfully opened /proc/net/route, arp,
        fib_trie or dev (what ip, ifconfig, arp and route read), or /etc/hosts (shows the
        container IP). Reads of /etc/hosts by the web server processes themselves are
        excluded (name resolution); any other resolver (wget, curl, ping) will still match.
      condition: >
        lab_open_ok and lab_in_scope and
        ((fd.directory = "/proc/net" and fd.filename in ("route", "arp", "fib_trie", "dev")) or
         (fd.name = "/etc/hosts" and not proc.name in (lab_web_processes)))
      output: >-
        Network configuration read
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname file=%fd.name res=%evt.res cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_discovery, T1016]
 
    - rule: "Discovery: Kernel Module List Read"
      desc: A process in a monitored container successfully opened /proc/modules (lsmod).
      condition: >
        lab_open_ok and lab_in_scope and
        fd.name = "/proc/modules"
      output: >-
        Kernel module list read
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname file=%fd.name res=%evt.res cmd=%proc.cmdline)
      priority: WARNING
      tags: [lab, mitre_discovery, T1082, kernel]
 
    - rule: "Privilege Escalation: su to root in Container"
      desc: su was executed without arguments, with "-" or with root as target in a monitored container.
      condition: >
        lab_spawned_process and lab_in_scope and
        proc.name = "su" and
        (proc.args = "" or proc.args = "-" or proc.args contains "root")
      output: >-
        su to root in container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname cmd=%proc.cmdline)
      priority: WARNING
      tags: [lab, mitre_privilege_escalation, T1078.003, privilege_escalation]
 
    - rule: "Privilege Escalation: Mount in Container"
      desc: >
        The mount syscall was issued from a monitored container (attempt or success,
        see res). Typical step of an escape to the host filesystem.
      condition: >
        lab_in_scope and evt.type = mount
      output: >-
        Mount operation in container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname
        src=%evt.arg.dev target=%evt.arg.dir fstype=%evt.arg.type res=%evt.res cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [lab, mitre_privilege_escalation, T1611, container_escape]
 
    - rule: "Privilege Escalation: chroot in Container"
      desc: >
        The chroot syscall was issued from a monitored container (attempt or success,
        see res). Typically follows a host filesystem mount.
      condition: >
        lab_in_scope and evt.type = chroot
      output: >-
        chroot in container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname
        target=%evt.arg.path res=%evt.res cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [lab, mitre_privilege_escalation, T1611, container_escape]
 
    - rule: "Privilege Escalation: Kernel Module Load or Unload"
      desc: >
        init_module, finit_module or delete_module was issued from a monitored container
        (attempt or success, see res), regardless of the binary used (e.g. busybox insmod).
      condition: >
        lab_in_scope and
        evt.type in (init_module, finit_module, delete_module)
      output: >-
        Kernel module load or unload from container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname action=%evt.type res=%evt.res cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [lab, mitre_privilege_escalation, mitre_persistence, T1547.006, kernel]
 
    - rule: "Defense Evasion: ptrace Attach to Process"
      desc: A process in a monitored container attached to another process with ptrace (injection / debugging).
      condition: >
        lab_in_scope and evt.type = ptrace and
        evt.arg.request in (PTRACE_ATTACH, PTRACE_SEIZE)
      output: >-
        ptrace attach in container
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname
        request=%evt.arg.request target_pid=%evt.arg.pid res=%evt.res cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [lab, mitre_defense_evasion, mitre_privilege_escalation, T1055.008, process_injection]
 
    - rule: "Defense Evasion: Executable Permission Set (chmod)"
      desc: A file was successfully made executable with chmod / fchmod / fchmodat in a monitored container.
      condition: >
        lab_in_scope and
        evt.type in (chmod, fchmod, fchmodat) and evt.rawres = 0 and
        evt.arg.mode contains "S_IX"
      output: >-
        File made executable
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname
        file=%evt.arg.filename mode=%evt.arg.mode res=%evt.res cmd=%proc.cmdline)
      priority: WARNING
      tags: [lab, mitre_defense_evasion, T1222.002, file_modification]
 
    - rule: "Command and Control: Ingress Transfer from Web Process"
      desc: >
        A web server process, or a descendant of one (up to 3 levels), opened an outbound
        TCP connection to a non-standard port (loopback excluded). Typical of a tool download
        triggered through the web app (e.g. wget / busybox fetching binaries after command
        injection); a reverse shell looks the same at this level. Transfers served on an
        allow-listed port (80, 443, 3306, 5432) are not detected.
      condition: >
        lab_in_scope and evt.type = connect and
        (fd.typechar = 4 or fd.typechar = 6) and fd.l4proto = tcp and
        (proc.name in (lab_web_processes) or proc.pname in (lab_web_processes) or
         proc.aname[2] in (lab_web_processes) or proc.aname[3] in (lab_web_processes)) and
        not fd.sport in (lab_web_allowed_ports) and
        not fd.sip in ("127.0.0.1", "::1")
      output: >-
        Outbound connection from web process to non-standard port (possible tool transfer)
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname dst=%fd.sip:%fd.sport res=%evt.res cmd=%proc.cmdline)
      priority: CRITICAL
      tags: [lab, mitre_command_and_control, T1105, T1571, network]
 
    - rule: "Command and Control: Listener on Non-Standard Port"
      desc: A process in a monitored container started listening on a port outside the allow-list.
      condition: >
        lab_in_scope and evt.type = listen and
        not fd.sport in (lab_listen_allowed_ports)
      output: >-
        Listener on non-standard port
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname port=%fd.sport res=%evt.res cmd=%proc.cmdline)
      priority: WARNING
      tags: [lab, mitre_command_and_control, T1571, network]
 
    - rule: "Command and Control: Container to Node Connection on Non-Standard Port"
      desc: >
        A process in a monitored container opened an outbound TCP connection to the address of a
        cluster node (lab_node_ips) on a port outside the allow-list. A container normally talks
        to other pods and services, not to the node it runs on; such a connection is typical of a
        process that reaches a listener on the host, or of a client (nc) connecting to a service the
        attacker exposed through the node. Matched on the connect itself, whatever the client is.
      condition: >
        lab_in_scope and evt.type = connect and
        (fd.typechar = 4 or fd.typechar = 6) and fd.l4proto = tcp and
        fd.sip in (lab_node_ips) and
        not fd.sport in (lab_node_allowed_ports)
      output: >-
        Container to node connection on non-standard port
        (host=%evt.hostname ns=%k8smeta.ns.name pod=%k8smeta.pod.name container=%container.id
        user=%user.name proc=%proc.name pid=%proc.pid parent=%proc.pname dst=%fd.sip:%fd.sport res=%evt.res cmd=%proc.cmdline)
      priority: WARNING
      tags: [lab, mitre_command_and_control, T1571, network]
 
    - rule: "Command and Control: Host Listener on Non-Standard Port"
      desc: >
        A process running on the node itself (not in a container) started listening on a
        TCP port outside the allow-list of the node's own services. Loopback is excluded.
      condition: >
        evt.type = listen and container.id = host and
        (fd.typechar = 4 or fd.typechar = 6) and
        not fd.sip in ("127.0.0.1", "::1", "127.0.0.53", "127.0.0.54") and
        not fd.sport in (lab_host_listen_allowed_ports)
      output: >-
        Host listener on non-standard port
        (host=%evt.hostname container=%container.id user=%user.name proc=%proc.name pid=%proc.pid
        parent=%proc.pname bind=%fd.sip:%fd.sport res=%evt.res cmd=%proc.cmdline)
      priority: NOTICE
      tags: [lab, mitre_command_and_control, T1571, network, host]
